[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-echo-core"
version = "0.1.0"
description = "Shared library for cardio-echo-suite services: auth, audit, FHIR, DICOM, ONNX, quantization, dynamic model loading"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "cardio-echo-suite authors"}]
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "pyjwt>=2.8",
    "pydicom>=2.3",
    "numpy>=1.22",
]

[project.optional-dependencies]
onnx = ["onnx>=1.14", "onnxruntime>=1.18"]
quantize = ["auto-gptq>=0.7", "accelerate>=0.23", "bitsandbytes>=0.41"]
test = ["pytest>=7.0", "httpx>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cardio_echo_core*"]
