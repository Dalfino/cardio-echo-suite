# cardio-echo-suite — GPU deployment
# Usage: docker compose -f deploy/docker-compose.gpu.yml up
#
# Requires the NVIDIA Container Toolkit:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
services:
  echonet-dynamic:
    build:
      context: ../services/echonet-dynamic
      args:
        BASE: nvidia/cuda:11.8.0-cudnn8-runtime-ubuntu22.04
    image: cardio-echo-suite/echonet-dynamic:gpu-latest
    ports:
      - "8001:8001"
    environment:
      ECHONET_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  echoprime:
    build:
      context: ../services/echoprime
    image: cardio-echo-suite/echoprime:gpu-latest
    ports:
      - "8002:8002"
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  panecho:
    build:
      context: ../services/panecho
    image: cardio-echo-suite/panecho:gpu-latest
    ports:
      - "8003:8003"
    environment:
      TORCH_HOME: /root/.cache/torch
    volumes:
      - torch-cache:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  orchestrator:
    build:
      context: ../services/orchestrator
    image: cardio-echo-suite/orchestrator:latest
    ports:
      - "8080:8080"
    environment:
      ECHONET_URL: http://echonet-dynamic:8001
      ECHOPRIME_URL: http://echoprime:8002
      PANECHO_URL: http://panecho:8003
    depends_on:
      - echonet-dynamic
      - echoprime
      - panecho
    restart: unless-stopped

volumes:
  hf-cache:
  torch-cache:
