name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { dir: packages/cardio-echo-core, name: cardio-echo-core }
          - { dir: services/echonet-dynamic, name: echonet-dynamic }
          - { dir: services/echoprime, name: echoprime }
          - { dir: services/panecho, name: panecho }
          - { dir: services/ecg-fm, name: ecg-fm }
          - { dir: services/medsam2, name: medsam2 }
          - { dir: services/nnunet-cmr, name: nnunet-cmr }
          - { dir: services/neurokit, name: neurokit }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install cardio-echo-core (shared dependency)
        if: matrix.package.name != 'cardio-echo-core'
        run: |
          pip install --upgrade pip
          pip install -e packages/cardio-echo-core

      - name: Install ${{ matrix.package.name }} test deps
        working-directory: ${{ matrix.package.dir }}
        run: |
          pip install -r requirements.txt || true
          if [ -d upstream ]; then
            pip install -e upstream/ || true
          fi
          pip install pytest httpx

      - name: Run tests
        working-directory: ${{ matrix.package.dir }}
        run: python -m pytest tests/ -v --tb=short
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
